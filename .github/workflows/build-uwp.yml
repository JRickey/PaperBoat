name: build-uwp

on:
  workflow_dispatch:
    inputs:
      rotate_signing_certificate:
        description: Generate and export a new Windows-native signing certificate
        required: false
        default: false
        type: boolean
  push:
    branches: [uwp-xbox]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  build-uwp:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y

      - name: Install certificate sealing dependency
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.rotate_signing_certificate }}
        shell: pwsh
        run: python -m pip install pynacl

      - name: Restore native dependencies and objects
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            vcpkg
            build-windows-uwp
          key: ${{ runner.os }}-vs2022-paperboat-uwp-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'src/**', 'external/libultraship/**', 'external/torch/**') }}
          restore-keys: |
            ${{ runner.os }}-vs2022-paperboat-uwp-

      - name: Build Paper Boat native DLL
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          cmake -S . -B build-windows-uwp -G "Ninja" `
            "-DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/cmake/toolchains/windows-clang-cl.cmake" `
            "-DPAPERBOAT_UWP=ON" `
            "-DCMAKE_BUILD_TYPE=Release"
          cmake --build build-windows-uwp --parallel 10

      - name: Save native dependencies and objects
        if: always() && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            vcpkg
            build-windows-uwp
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      - name: Configure UWP package
        shell: pwsh
        run: |
          cmake -S uwp -B build-uwp -G "Visual Studio 17 2022" -A x64 `
            -DPAPERBOAT_BUILD_DIR="${{ github.workspace }}/build-windows-uwp" `
            -DPAPERBOAT_PACKAGE_VERSION="1.0.${{ github.run_number }}.0"

      - name: Build and sign MSIX bundle
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UWP_SIGNING_PFX_BASE64: ${{ secrets.UWP_SIGNING_PFX_BASE64 }}
          UWP_SIGNING_PFX_PASSWORD: ${{ secrets.UWP_SIGNING_PFX_PASSWORD }}
          ROTATE_SIGNING_CERTIFICATE: ${{ github.event_name == 'workflow_dispatch' && inputs.rotate_signing_certificate }}
        run: |
          if ($env:ROTATE_SIGNING_CERTIFICATE -eq "true") {
            if (-not $env:UWP_SIGNING_PFX_PASSWORD) {
              throw "UWP_SIGNING_PFX_PASSWORD is required to rotate the signing certificate."
            }
            $cert = New-SelfSignedCertificate `
              -Type Custom `
              -Subject "CN=JRickey" `
              -KeyUsage DigitalSignature `
              -FriendlyName "Paper Boat UWP CI" `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")
            $pfxPath = Join-Path $env:RUNNER_TEMP "PaperBoat-UWP.pfx"
            $securePassword = ConvertTo-SecureString $env:UWP_SIGNING_PFX_PASSWORD -AsPlainText -Force
            Export-PfxCertificate -Cert $cert -FilePath $pfxPath `
              -Password $securePassword | Out-Null
            python .github/scripts/seal-actions-secret.py $pfxPath
          } elseif ($env:UWP_SIGNING_PFX_BASE64 -and $env:UWP_SIGNING_PFX_PASSWORD) {
            $pfxPath = Join-Path $env:RUNNER_TEMP "PaperBoat-UWP.pfx"
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:UWP_SIGNING_PFX_BASE64))
            $securePassword = ConvertTo-SecureString $env:UWP_SIGNING_PFX_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfxPath `
              -CertStoreLocation "Cert:\CurrentUser\My" -Password $securePassword
          } else {
            Write-Warning "Stable signing secrets are unavailable; generating a one-run development certificate."
            $cert = New-SelfSignedCertificate `
              -Type Custom `
              -Subject "CN=JRickey" `
              -KeyUsage DigitalSignature `
              -FriendlyName "Paper Boat UWP CI fallback" `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")
          }
          msbuild build-uwp/PaperBoat-UWP.vcxproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:AppxBundle=Always `
            /p:AppxBundlePlatforms=x64 `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateThumbprint=$($cert.Thumbprint)

      - name: Remove temporary signing certificate
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.rotate_signing_certificate }}
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue "$env:RUNNER_TEMP/PaperBoat-UWP.pfx"

      - name: Upload UWP package
        uses: actions/upload-artifact@v4
        with:
          name: Paper-Boat-UWP-US-x64
          if-no-files-found: error
          path: |
            build-uwp/AppPackages/**/*.msixbundle
            build-uwp/AppPackages/**/*.appxbundle
            build-uwp/AppPackages/**/*.msix
            build-uwp/AppPackages/**/*.appx
            build-uwp/AppPackages/**/*.cer

      - name: Upload native debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: Paper-Boat-UWP-symbols
          if-no-files-found: error
          path: build-windows-uwp/PaperBoat.pdb
